<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원격 실행">
<title>원격 실행 보드</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --sub:#6b7280; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626; --run:#d97706; --wait:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#111827; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:18px; margin:0; cursor:pointer; }
  header .runner { margin-left:auto; font-size:12.5px; padding:3px 10px; border-radius:999px; background:#374151; color:#e5e7eb; }
  header .runner.on { background:#065f46; color:#d1fae5; }
  header .runner.off { background:#7f1d1d; color:#fee2e2; }
  header .runner .r { margin-left:10px; white-space:nowrap; }
  header .runner .r:first-child { margin-left:0; }
  header .runner .r.off { opacity:.6; }
  header .who { font-size:13px; color:#cbd5e1; }
  header button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; cursor:pointer; }

  /* 왼쪽(작업)과 오른쪽(진행 상황)을 한 격자로 묶어 줄 높이를 맞춘다 */
  #board { max-width:1100px; margin:0 auto; padding:16px; }
  /* 구역(주문/재고, 상품 …)마다 격자 하나: 왼쪽 = 검은 제목 띠 + 작업, 오른쪽 = 진행 상황 */
  .sec { display:grid; grid-template-columns: 420px minmax(0,1fr); column-gap:14px; margin-bottom:44px; }
  .L.head { background:#111827; color:#fff; border:1px solid #111827; border-radius:10px 10px 0 0; padding:10px 18px; display:flex; align-items:center; }
  .L.head h2 { font-size:26px; margin:0; font-weight:700; letter-spacing:1px; }
  .L.pad, .R.pad { height:6px; }
  .L, .R { background:var(--card); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:0 14px; min-width:0; }
  .top { border-top:1px solid var(--line); border-radius:10px 10px 0 0; padding-top:12px; }
  .bot { border-bottom:1px solid var(--line); border-radius:0 0 10px 10px; height:12px; }
  .top h2 { font-size:14px; margin:0 0 6px; color:#374151; }
  .gh h3 { font-size:13px; margin:8px 0 2px; color:#111827; border-left:3px solid var(--pri); padding-left:7px; }
  .R.gh h3 { visibility:hidden; }
  /* 소제목 줄: 왼쪽 = 소제목 (+ 그룹 전체 실행 버튼), 오른쪽 = 그 버튼의 진행 상황. 두 번째 소제목부터는 위에 여백을 둔다 */
  .L.gh { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .L.gh .btn { background:#111827; color:#fff; }   /* 그룹 전체 버튼은 검은 바탕·흰 글씨 */
  .L.gh .btn:hover { background:#374151; }
  /* 소제목 줄은 높이를 고정해, 오른쪽 칩이 있든 없든 버튼~첫 항목 간격이 그룹마다 같게 한다 */
  .L.gh, .R.gh { height:56px; padding-top:14px; padding-bottom:12px; }
  .gh.sp { height:72px; padding-top:30px; }                  /* 두 번째 소제목부터는 앞 그룹과 더 띄움 */
  .R.gh { padding-top:8px; padding-bottom:4px; }             /* 칩(약 40px)이 들어갈 자리 */
  .R.gh.sp { padding-top:24px; }
  /* 소제목 줄 오른쪽 칩은 한 줄로만(가로 스크롤) → 사진이 여러 장이어도 소제목 줄 높이가 안 늘어나, 버튼~첫 항목 간격이 그룹마다 같다 */
  .R.gh .job { border-bottom:0; min-height:0; padding:6px 0 0; white-space:nowrap; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; }
  .job { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); min-height:42px; }   /* 항목 줄 간격 살짝 여유 */
  .lastrow .job { border-bottom:0; }
  .L .name { flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .L .desc { color:var(--sub); font-size:11.5px; display:inline; margin-left:6px; }
  .L .ctl { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .L .job.haspar { flex-wrap:wrap; }
  .L .job.haspar .name { flex:1 1 100%; }
  .L .job.haspar .ctl { margin-left:auto; }
  /* 하위 항목(A_1·A_2·A_3 처럼 상위 작업 아래 들여쓴 줄) — 2026-10-12 사장님 메뉴 수정 */
  .L .job.sub .name { padding-left:18px; font-size:13px; }
  .L .job.sub .name::before { content:'└'; color:#9ca3af; margin-right:5px; font-size:11px; }
  .L input[type=text] { padding:5px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; width:160px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:#fff; color:var(--txt); border:0; padding:5px 10px; font-size:12.5px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:#e0e7ff; color:#1e3a8a; font-weight:600; }
  .btn { background:#9ca3af; color:#fff; border:0; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px; white-space:nowrap; }   /* 적용 버튼 = 회색 (진한 회색에서 3톤 밝게) */
  .btn:hover { background:#6b7280; }
  .btn:disabled { background:#9ca3af; cursor:not-allowed; }

  .R .job { font-size:12.5px; color:var(--sub); white-space:nowrap; overflow-x:auto; overflow-y:hidden; gap:6px; scrollbar-width:none; }
  .R .job::-webkit-scrollbar { display:none; }
  .R .time { color:var(--txt); }
  /* 결과 파일 = 상태 배지와 같은 알약 모양. 이름은 "(F_1) 1007" 처럼 앞머리+날짜만 (전체 이름은 길게 누르거나 마우스를 올리면 보임) */
  .R .files { display:flex; flex-wrap:wrap; gap:4px; min-width:0; }
  .R .files a, .R .files span { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; color:#fff; background:var(--pri); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
  .R .files a:hover { background:#1d4ed8; }
  .R .files span { background:#cbd5e1; color:#374151; }   /* 드라이브 동기화 전(링크 없음) */
  .st { display:inline-block; padding:1px 7px; border-radius:999px; color:#fff; font-size:11px; background:#9ca3af; }
  .st.대기 { background:var(--wait);} .st.실행중, .st.중지요청 { background:var(--run);} .st.완료 { background:var(--ok);} .st.실패 { background:var(--bad);} .st.취소, .st.중지 { background:#cbd5e1; color:#374151; }
  /* 상태 칩 = [배지 / 그 아래 작은 시각] (+ 파일). 배지 우측 상단에 반쯤 걸친 동그란 X (누르면 취소·중지·표시 지우기) */
  .chip { display:inline-flex; align-items:flex-start; gap:6px; padding:4px 0 2px; margin-right:10px; white-space:nowrap; max-width:100%; }
  .L .job, .R .job { height:100%; }   /* 오른쪽 칩이 줄바꿈돼 줄이 높아져도 양쪽 내용이 세로 가운데 */
  .chip .b { position:relative; display:inline-flex; flex-direction:column; align-items:center; padding-right:5px; }
  .chip .x { position:absolute; top:-8px; right:-4px; width:19px; height:19px; border-radius:50%; border:1px solid #fff; background:var(--bad); color:#fff; font-size:13px; line-height:17px; text-align:center; cursor:pointer; padding:0; }   /* 2026-10-16 사장님: 동그란 게 더 예쁨 → 14px → 17px → 19px, 빨강 */
  .chip .b { padding-right:8px; }
  .chip .x:hover { background:#b91c1c; }
  .chip.실행중 .x, .chip.중지요청 .x { background:var(--bad); }
  .chip .t { display:block; color:var(--sub); font-size:10px; line-height:12px; margin-top:2px; }
  .uperr { color:var(--bad); font-size:11px; white-space:normal; word-break:break-all; }
  .chip.중지요청 .st::after { content:' → 중지 중 (X 한 번 더 = 강제)'; }

  /* 사진 자르기 화면: 10:7 틀 안에서 사진을 끌어 위치를 맞추고, 슬라이더·두 손가락으로 확대 */
  #crop { position:fixed; inset:0; background:rgba(17,24,39,.92); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  #crop.show { display:flex; }
  #crop .tip { color:#e5e7eb; font-size:13px; }
  #cropView { position:relative; width:min(92vw,640px); aspect-ratio:10/7; overflow:hidden; background:#000; border:2px solid #fff; border-radius:6px; touch-action:none; cursor:grab; }
  #cropView img { position:absolute; left:50%; top:50%; max-width:none; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  /* 가이드 라인: 3등분 선 + 가운데 십자 */
  #cropView .guide { position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
      linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
  #cropView .guide::before, #cropView .guide::after { content:''; position:absolute; left:50%; top:50%; background:#ef4444; transform:translate(-50%,-50%); }
  #cropView .guide::before { width:22px; height:2px; } #cropView .guide::after { width:2px; height:22px; }
  #crop input[type=range] { width:min(80vw,420px); }
  #crop .row { display:flex; gap:10px; }
  #crop .row button { border:0; border-radius:8px; padding:10px 22px; font-size:14px; cursor:pointer; }
  #crop .ok { background:var(--pri); color:#fff; } #crop .no { background:#374151; color:#fff; }
  /* 재고체크 카메라 (A_1 사진 촬영 → 적용, 2026-10-15 사장님 지시): 사진첩·가이드 팝업 없이 바로 촬영 화면.
     위 = 실시간 카메라 + 셔터, 아래 = 매대 알파벳 A~T 고정 자리(2줄, 필요한 매대만 불 켜짐) + SEND.
     알파벳을 누르고 3장 이상 연속 촬영 → 다음 알파벳 … → SEND 로 찍어 둔 사진 전부 한 번에 전송 */
  /* 카메라 화면 — 가로(눕힌) 기본: [알파벳 세로 2열 | 화면 | 셔터]. ⇄ 로 알파벳/셔터 좌우 바꿈. 세로로 들면 알파벳이 아래로 감 */
  #cam { position:fixed; inset:0; background:#000; z-index:60; display:none; flex-direction:row; height:100vh; height:100dvh; }
  #cam.show { display:flex; }
  #cam.rev { flex-direction:row-reverse; }
  #cam .view { position:relative; flex:1; min-width:0; min-height:0; overflow:hidden; background:#000; }
  #cam video { width:100%; height:100%; object-fit:cover; display:block; }
  #cam .top { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:8px 10px; background:linear-gradient(rgba(0,0,0,.55), transparent); color:#fff; font-size:13px; pointer-events:none; }
  #cam .top .x { width:34px; height:34px; border-radius:50%; border:0; background:rgba(255,255,255,.2); color:#fff; font-size:18px; cursor:pointer; pointer-events:auto; }
  #cam .top .info { flex:1; text-align:right; text-shadow:0 1px 2px #000; }
  #cam .top .dt { height:30px; padding:0 10px; border-radius:15px; border:1px solid rgba(255,255,255,.5); background:rgba(0,0,0,.35); color:#fff; font-size:12px; cursor:pointer; pointer-events:auto; white-space:nowrap; }
  #cam .top .dt.on { background:#059669; border-color:#059669; }
  #cam .top .dt.bad { background:#b45309; border-color:#b45309; }
  #cam .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s; }
  #cam .flash.on { opacity:.8; transition:none; }
  #cam .side { position:relative; width:96px; flex:none; background:#0b0f19; display:flex; align-items:center; justify-content:center; }
  #cam .shutter { width:66px; height:66px; border-radius:50%; border:5px solid #fff; background:rgba(255,255,255,.35); cursor:pointer; padding:0; }
  #cam .shutter:active { background:#fff; }
  #cam .swap { position:absolute; top:6px; right:6px; width:28px; height:22px; border:0; border-radius:6px; background:rgba(255,255,255,.18); color:#e5e7eb; font-size:14px; line-height:22px; cursor:pointer; padding:0; }
  #cam.rev .swap { right:auto; left:6px; }
  #cam .pad { flex:none; width:118px; background:#111827; display:flex; flex-direction:column; padding:6px 6px; padding-bottom:max(6px, env(safe-area-inset-bottom)); }
  #cam .keys { flex:1; min-height:0; display:grid; grid-template-columns:repeat(2, 1fr); grid-template-rows:repeat(10, 1fr); grid-auto-flow:row; gap:4px; margin-bottom:5px; }
  #cam .key { position:relative; height:auto; min-height:0; border:0; border-radius:6px; background:#2b3140; color:#6b7280; font-size:15px; font-weight:700; cursor:pointer; padding:0; }
  #cam .key.on { background:#fde047; color:#111827; }                       /* 불 켜진 알파벳 = 이번에 찍어야 할 매대 */
  #cam .key.cur { outline:3px solid #fff; outline-offset:-3px; }            /* 지금 찍는 중인 매대 */
  #cam .key .n { position:absolute; top:-5px; right:-3px; min-width:16px; height:16px; line-height:16px; border-radius:8px; background:#ef4444; color:#fff; font-size:10px; padding:0 3px; }
  #cam .key .n.ok { background:#16a34a; }
  #cam .send { flex:none; width:100%; height:42px; border:0; border-radius:8px; background:#16a34a; color:#fff; font-size:14px; font-weight:800; letter-spacing:1px; cursor:pointer; }
  #cam .send:disabled { background:#374151; color:#9ca3af; }
  /* 세로로 들었을 때: 화면 위, 알파벳 10열×2행 아래, 셔터는 화면 위에 겹침 */
  @media (orientation: portrait){
    #cam, #cam.rev { flex-direction:column; }
    #cam .view { order:1; }
    #cam .pad { order:2; width:auto; padding:8px 8px 10px; padding-bottom:max(10px, env(safe-area-inset-bottom)); }
    #cam .keys { flex:none; grid-template-columns:repeat(10, 1fr); grid-template-rows:repeat(2, 1fr); grid-auto-flow:column; gap:5px; margin-bottom:6px; }
    #cam .key { height:42px; }
    #cam .send { height:46px; font-size:16px; letter-spacing:2px; }
    #cam .side { position:absolute; left:0; right:0; bottom:calc(8px + 42px*2 + 5px + 6px + 46px + max(10px, env(safe-area-inset-bottom))); width:auto; height:0; background:transparent; overflow:visible; z-index:2; }
    #cam .shutter { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); }
    #cam .swap { display:none; }
  }

  #setup { max-width:520px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  #setup h2 { font-size:15px; margin:0 0 12px; color:#374151; }
  #setup input { width:100%; padding:9px; margin:6px 0 12px; border:1px solid var(--line); border-radius:6px; }
  .hint { color:var(--sub); font-size:12px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }

  /* 좁은 화면(휴대폰): PC 와 같은 두 칸 배치를 유지하고 크기만 줄인다 */
  @media (max-width:700px){
    #board { padding:8px; }
    .sec { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); column-gap:8px; margin-bottom:28px; }
    .L.head { padding:8px 10px; }
    .L.head h2 { font-size:19px; letter-spacing:0; }
    .L, .R { padding:0 8px; }
    .top { padding-top:10px; }
    .top h2 { font-size:13px; }
    .gh h3 { font-size:12px; margin:6px 0 2px; }
    .L.gh, .R.gh { height:46px; padding-top:10px; padding-bottom:8px; }
    .gh.sp { height:58px; padding-top:22px; }
    .R.gh { padding-top:4px; padding-bottom:2px; }
    .R.gh.sp { padding-top:16px; }
    .job { min-height:40px; gap:6px; padding:5px 0; }
    .L .name { font-size:12.5px; }
    .L .desc { display:none; }
    .btn { padding:5px 9px; font-size:12px; }
    .R .job { font-size:11.5px; gap:4px; white-space:normal; flex-wrap:wrap; overflow:visible; }   /* 칩이 많으면 줄바꿈 (왼쪽 칸 높이도 같이 늘어남) */
    .R.gh .job { white-space:nowrap; flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; }   /* 소제목 줄만은 한 줄 유지 */
    .chip { margin-right:6px; padding:3px 0 1px; gap:4px; }
    .chip .t { font-size:9.5px; }
    .R .files a, .R .files span { max-width:110px; padding:1px 5px; font-size:10px; }
    .st { padding:1px 5px; font-size:10px; }
    header { padding:10px 12px; gap:8px; }
    header h1 { font-size:16px; }
    header .who { display:none; }
    header .runner { font-size:11px; padding:2px 8px; }
    .lastRefresh { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()" title="홈으로">원격 실행 보드</h1>
  <span class="runner" id="runner"></span>
  <span class="who" id="who"></span>
  <button onclick="openSetup()">설정</button>
</header>

<div id="setup" style="display:none">
  <h2>연결 설정</h2>
  <label>Apps Script 웹앱 URL</label>
  <input id="cfgUrl" placeholder="https://script.google.com/macros/s/....../exec" value="https://script.google.com/macros/s/AKfycbxfPwqeMm7oy2bm4gUp3orBDBsTLrKA2Q9wQNC-ADs3Qp9hc2nZyT_uK7Lvmgqc4t3x/exec">
  <label>내 토큰 (구글 시트 [사용자] 탭)</label>
  <input id="cfgToken" placeholder="토큰">
  <button class="btn" onclick="saveSetup()">저장하고 연결</button>
  <p class="hint">설정은 이 브라우저에만 저장됩니다. 다른 PC·휴대폰에서는 다시 입력하세요.</p>
</div>

<main id="board" style="display:none"></main>
<div id="crop">
  <div class="tip">사진을 끌어서 위치를 맞추세요 (흰 틀 안쪽이 그대로 저장됩니다)</div>
  <div id="cropView"><img id="cropImg" alt=""><div class="guide"></div></div>
  <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1">

    <video id="camVideo" autoplay playsinline muted></video>

<script>
const LS = 'remote_board_cfg', MINE = 'remote_board_mine';
let cfg = JSON.parse(localStorage.getItem(LS) || 'null');
let timer = null;
let mine = []; try { mine = JSON.parse(sessionStorage.getItem(MINE) || '[]'); } catch(_) {}   // 이 화면에서 누른 작업 ID

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function openSetup(){ document.getElementById('setup').style.display='block'; document.getElementById('board').style.display='none';
  if(cfg){ cfgUrl.value=cfg.url; cfgToken.value=cfg.token; } }
function saveSetup(){ cfg={url:cfgUrl.value.trim(), token:cfgToken.value.trim()}; localStorage.setItem(LS, JSON.stringify(cfg)); init(); }
function goHome(){ init(); }   // 제목 클릭 → 설정 화면을 닫고 보드로 (버튼 목록도 다시 읽음)

async function api(params, body){
  const u = new URL(cfg.url); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set('token', cfg.token);
  const opt = body ? { method:'POST', body: JSON.stringify(Object.assign({token:cfg.token}, body)), headers:{'Content-Type':'text/plain;charset=utf-8'} } : {};
  const r = await fetch(u, opt); return r.json();
}

async function init(){
  if(!cfg || !cfg.url || !cfg.token) return openSetup();
  try{
    const res = await api({action:'jobs'});
    if(!res.ok) { toast(res.error); return openSetup(); }
    document.getElementById('who').textContent = res.user + ' 님';
    showRunner(res.runner_seen, res.runner_busy, res.runners, null);
    document.getElementById('setup').style.display='none'; document.getElementById('board').style.display='block';
    tunnelInfo = res.tunnel || null;   // 2026-10-20 직통: PC 사진 수신 서버 주소
    guidePanels = res.guide_panels || null;   // (예정) 시트가 주는 '찍을 매대' 목록 — 촬영 가이드에 표시
    renderJobs(res.jobs); refreshStatus();
    clearInterval(timer); timer = setInterval(refreshStatus, 10000);
  }catch(e){ toast('연결 실패: '+e.message); openSetup(); }
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 구역 구성: 시트의 [주제] 를 큰 구역으로 묶는다. 목록에 없는 주제는 첫 구역으로 들어간다
const SECTIONS = [
  { title:'주문 / 재고', topics:null },          // null = 다른 구역에 속하지 않은 주제 전부
  { title:'상품',        topics:['상품'] },
];

function renderJobs(jobs){
  const b = document.getElementById('board'); b.innerHTML = '';
  const claimed = new Set(SECTIONS.flatMap(s => s.topics || []));
  SECTIONS.forEach(sec => {
    const mineJobs = jobs.filter(j => sec.topics ? sec.topics.includes(j['주제']) : !claimed.has(j['주제']));
    if(!mineJobs.length) return;
    const groups = {}; mineJobs.forEach(j => (groups[j['주제']] = groups[j['주제']] || []).push(j));
    const box = document.createElement('section'); box.className = 'sec'; b.appendChild(box);
    box.insertAdjacentHTML('beforeend', `<div class="L head"><h2>${esc(sec.title)}</h2></div><div class="R top"><h2>진행 상황 <span class="hint lastRefresh"></span></h2></div>`);
    const entries = Object.entries(groups);
    entries.forEach(([g, all], gi) => {
      // 파라미터 = '그룹' 인 작업은 줄을 따로 만들지 않고 소제목 오른쪽 끝에 버튼으로 붙인다 (예: 재고매칭 → 전체 자동실행)
      // 파라미터 '그룹사진' 은 소제목 버튼이되, 누르면 카메라가 바로 열려 찍은 사진을 드라이브에 저장 (재고체크 사진촬영)
      const headJob = (g !== sec.title) ? all.find(j => j['파라미터'] === '그룹' || j['파라미터'] === '그룹사진') : null;
      const list = all.filter(j => j !== headJob);
      const sp = gi ? ' sp' : '';   // 두 번째 소제목부터 위 여백
      // 주제 이름이 구역 제목과 같으면(예: 상품) 소제목은 생략
      if(g === sec.title) box.insertAdjacentHTML('beforeend', `<div class="L pad"></div><div class="R pad"></div>`);
      else {
        const Lh = document.createElement('div'); Lh.className = 'L gh' + sp;
        Lh.innerHTML = `<h3>${esc(g)}</h3>` + (headJob ? `<button class="btn" title="${esc(headJob['설명']||'')}">${esc(headJob['버튼이름'])}</button>` : '');
        const Rh = document.createElement('div'); Rh.className = 'R gh' + sp;
        Rh.innerHTML = headJob ? `<div class="job stat" data-code="${esc(headJob['작업코드'])}"></div>` : `<h3>.</h3>`;
        if(headJob) Lh.querySelector('button.btn').onclick = () => headJob['파라미터'] === '그룹사진' ? shootPhoto(headJob, Lh, Rh) : run(headJob, Lh);
        box.appendChild(Lh); box.appendChild(Rh);
      }
      list.forEach((j, i) => {
        const last = (gi === entries.length-1 && i === list.length-1) ? ' lastrow' : '';
        let paramHtml = '';
        const par = j['파라미터'] || '';
        const isRange = par==='기간', isPhoto = par==='사진';
        // 하위 항목: '하위'(일반 실행) / '하위사진'(촬영 가이드 → 사진첩) / '하위목업'(버튼만, 아직 연결 안 됨)  — 2026-10-12
        const isSub = par.startsWith('하위'), isShoot = par==='하위사진' || par==='그룹사진', isMock = par==='하위목업';
        if(isRange){ paramHtml = `<span class="seg" data-k="range"><button type="button" data-v="today" class="on">오늘</button><button type="button" data-v="week">일주일</button></span>`; }
        else if(j['파라미터']==='텍스트'){ paramHtml = `<input type="text" data-k="text" placeholder="${esc(j['설명']||'')}">`; }
        const L = document.createElement('div'); L.className = 'L' + last;
        const desc = (!isRange && j['설명']) ? `<div class="desc">${esc(j['설명'])}</div>` : '';
        L.innerHTML = `<div class="job${paramHtml?' haspar':''}${isSub?' sub':''}"><div class="name">${esc(j['버튼이름'])}${desc}</div><div class="ctl">${paramHtml}<button class="btn">적용</button></div></div>`;
        L.querySelectorAll('.seg button').forEach(b => b.onclick = () => { b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
        const R = document.createElement('div'); R.className = 'R' + last;
        R.innerHTML = `<div class="job stat" data-code="${esc(j['작업코드'])}"></div>`;
        L.querySelector('button.btn').onclick = () => isPhoto ? pickPhoto(j, L, R) : isShoot ? openCamera(j, L, R) : isMock ? toast(`'${j['버튼이름']}' 은 아직 사람이 하는 작업입니다 (버튼만 준비, 연결 예정)`) : run(j, L);
        box.appendChild(L); box.appendChild(R);
      });
    });
    box.insertAdjacentHTML('beforeend', `<div class="L bot"></div><div class="R bot"></div>`);
  });
}

async function run(job, cell){
  const params = {}; cell.querySelectorAll('input').forEach(i => params[i.dataset.k] = i.value);
  let label = '';
  const seg = cell.querySelector('.seg button.on');
  if(seg){
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const end = new Date(), start = new Date();
    if(seg.dataset.v === 'week') start.setDate(start.getDate() - 6);     // 오늘 포함 최근 7일
    params.start = ymd(start); params.end = ymd(end); params.range = seg.dataset.v;
    label = seg.dataset.v === 'week' ? ` (일주일: ${params.start} ~ ${params.end})` : ` (오늘: ${params.end})`;
  }
  if(!confirm(`'${job['버튼이름']}'${label} 을(를) 실행할까요?`)) return;
  const btn = cell.querySelector('button'); btn.disabled = true;
  try{
    const res = await api({}, {action:'enqueue', code: job['작업코드'], params});
    if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); }
    toast(res.ok ? '요청 등록 — PC 러너가 곧 실행합니다' : ('실패: '+res.error));
    refreshStatus();
  }catch(e){ toast('요청 실패: '+e.message); }
  btn.disabled = false;
}

// ---------- 상품사진 등록 ----------
// 적용 → 휴대폰 사진첩(또는 카메라)에서 사진 선택 → 10:7 로 자르기 → 저장 이름 입력 → 업로드
// → 드라이브 image 폴더에 저장되고 PC 러너가 \\wondercompany\...\0-주문서 만들기 (클로드)\image 로 옮긴다
const PHOTO_MAX_EDGE = 2000, PHOTO_QUALITY = 0.9;
const photoErr = {};    // 작업코드 → 마지막 업로드 실패 메시지 (다음에 다시 올릴 때까지 화면에 남김)
const uploading = {};   // 작업코드 → true (업로드 중에는 상태칸을 갱신으로 덮지 않음)

function pickPhoto(job, cell, statCell){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; inp.remove();
    if(!file) return;
    const cropped = await cropPhoto(file);      // 10:7 로 자르기 (취소하면 null)
    if(!cropped) return;
    const base = file.name.replace(/\.[^.]+$/, '');
    let name = prompt('저장할 사진 이름을 입력하세요 (확장자 제외)', /^(image|img|dsc|pxl|photo|kakaotalk)/i.test(base) ? '' : base);
    if(name === null) return;
    name = name.replace(/[\\/:*?"<>|]/g, '').trim();
    if(!name){ toast('사진 이름을 입력해야 합니다'); return; }
    const btn = cell.querySelector('button.btn'); btn.disabled = true;
    const stat = statCell.querySelector('.stat'); uploading[job['작업코드']] = true; delete photoErr[job['작업코드']];
    try{
      stat.innerHTML = `<span class="st 실행중">업로드 중</span> <span class="files"><span>${esc(name)}</span></span>`;
      const { blob, mime } = cropped;
      const data = await toBase64(blob);
      const res = await api({}, { action:'upload', code: job['작업코드'], name, mime, data });
      if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); toast(`사진 업로드 완료 — PC 러너가 image 폴더에 저장합니다 (${res.name})`); }
      else { toast('실패: ' + res.error); photoErr[job['작업코드']] = res.error || '알 수 없는 오류'; }
    }catch(e){ toast('업로드 실패: ' + e.message); photoErr[job['작업코드']] = '전송 실패: ' + e.message; }
    delete uploading[job['작업코드']]; btn.disabled = false;
    refreshStatus();
  };
  inp.click();
}

// ---------- 재고체크 사진촬영 ----------
// [사진촬영] → 휴대폰이 "사진 찍기 / 사진첩" 선택창을 띄움 → 사진첩에서 여러 장을 한 번에 골라 올릴 수 있다 (2026-10-08 사장님 지시: 촬영 딜레이 없이)
//   권장 흐름: 카메라 앱으로 연속 촬영 → [사진촬영] → 사진첩에서 전부 선택 → 한 번에 순차 업로드 (진행 "3/10" 칩 표시)
// → Apps Script 가 드라이브 4_재고체크사진 폴더에 저장하고 [재고체크사진] 탭에 기록, 보드에는 즉시 '완료' 칩
// 수량 판독용이라 휴대폰 원본 해상도 그대로 올린다(줄이지 않음). 칸 라벨이 같이 보이게, 정면에서 찍는다.
// ---------- 재고체크 사진 촬영 (A_1) ----------
// [A_1 ▸ 적용] → 바로 카메라 화면 (2026-10-15 사장님 지시: 가이드 팝업·사진첩 단계 없이, 한 장씩 올리지 않고 SEND 로 한 번에)
//   아래 알파벳 A~T 는 자리가 고정. 찍어야 할 매대(jobs 응답 guide_panels — 사입리스트↔칸코드 매칭 뒤 연결)만 불이 켜진다.
//   리스트가 없으면 아무 알파벳도 안 켜지고 SEND 만 켜짐 — 그래도 촬영·전송은 된다 (리스트 없이 재고 체크할 때)
//   알파벳 누르고 3장 이상 연속 촬영(원하는 만큼) → 다음 알파벳 … → SEND → 찍은 사진 전부 순차 업로드 → STOCK_AI 등록
//   사진 파일명에 매대 글자가 붙는다(재고체크_날짜_시각_A.jpg) → PC 판독이 그 매대 라벨만 믿도록 쓸 수 있음
//   카메라를 못 열면(권한 거부·PC 등) 사진첩 선택(shootPhoto)으로 대신
const PANELS = 'ABCDEFGHIJKLMNOPQRST'.split('');
const MIN_SHOTS = 3;
// 흐린 사진은 찍는 자리에서 바로 버린다 (2026-10-16 사장님 제안: 뭉개진 사진은 판독 전에 삭제)
//   선명도 = 긴 변 ≈1000px 로 상자 평균 축소한 흑백의 라플라시안 분산(PC stock_ai.py 와 같은 계산, 오차 0.5% 이내).
//   10/16 매대 사진 11장 1460~3460, 책상 시험샷 ≈230, 가우시안 σ3(글자 안 읽힘) 294, 흔들림 15px(안 읽힘) 748,
//   σ1.7(흐릿하지만 읽힘) 1190 → 1000 미만이면 버림. 같은 매대에서 3번 연속 흐리면(조명 등으로 기준이 안 맞는 경우)
//   보관하고 PC 판독의 2차 검사에 맡긴다
const BLUR_MIN = 1000;
async function sharpness(blob){
  try{
    let src = null;
    if(window.createImageBitmap){ try{ src = await createImageBitmap(blob); }catch(_){ src = null; } }
    if(!src){
      src = await new Promise((ok, no) => { const im = new Image(); const u = URL.createObjectURL(blob);
        im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => { URL.revokeObjectURL(u); no(new Error('decode')); }; im.src = u; });
    }
    let w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    if(!w || !h) return -1;
    // 브라우저 축소(drawImage)는 기종마다 뭉개는 정도가 달라 값이 흔들림 → 원본 화소를 받아 k×k 칸 평균(상자 평균)으로 직접 줄인다
    //   = PC 쪽 cv2.resize(INTER_AREA, 정수 배율) 과 같은 계산. 1600만 화소 넘는 원본만 먼저 절반으로(사파리 캔버스 한도)
    let cw = w, ch = h;
    if(w * h > 16e6){ cw = Math.round(w / 2); ch = Math.round(h / 2); }
    const c = document.createElement('canvas'); c.width = cw; c.height = ch;
    const x = c.getContext('2d', { willReadFrequently:true }); x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, cw, ch);
    if(src.close) src.close();
    const d = x.getImageData(0, 0, cw, ch).data;
    const k = Math.max(1, Math.round(Math.max(cw, ch) / 1000)), tw = Math.floor(cw / k), th = Math.floor(ch / k);
    if(tw < 3 || th < 3) return -1;
    const g = new Float32Array(tw * th), kk = k * k;
    for(let y = 0; y < th * k; y++){
      const gy = Math.floor(y / k) * tw; let j = (y * cw) * 4;
      for(let xx = 0; xx < tw * k; xx++, j += 4) g[gy + Math.floor(xx / k)] += 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    }
    for(let i = 0; i < g.length; i++) g[i] /= kk;
    c.width = c.height = 1;   // 큰 캔버스 메모리 바로 반납
    let n = 0, sum = 0, sq = 0;
    for(let y = 1; y < th - 1; y++){
      for(let xx = 1; xx < tw - 1; xx++){
        const i = y * tw + xx, v = g[i - tw] + g[i + tw] + g[i - 1] + g[i + 1] - 4 * g[i];
        sum += v; sq += v * v; n++;
      }
    }
    if(!n) return -1;
    const m = sum / n; return sq / n - m * m;
  }catch(_){ return -1; }   // 측정 못 하면 통과시킨다
}
let guidePanels = null;   // ['A','C',…] 또는 null
let cam = null;           // { job, cell, statCell, stream, ic, shots:[{blob,mime,cell}], cur }

// 가로 화면 기본: 알파벳 세로 2열(AB/CD/…)이 왼쪽, 셔터가 오른쪽. 오른쪽 위 ⇄ 로 좌우를 바꾸고 그 선택은 기억한다
function camApplySide(){ let rev = false; try{ rev = localStorage.getItem('camRev') === '1'; }catch(_){} document.getElementById('cam').classList.toggle('rev', rev); }
document.getElementById('camSwap').onclick = () => { let rev = false; try{ rev = localStorage.getItem('camRev') === '1'; localStorage.setItem('camRev', rev ? '0' : '1'); }catch(_){} camApplySide(); };
async function camLockLandscape(){   // 가능한 기기에서만(안드로이드 전체화면) 가로로 고정 — 안 되면 그냥 지나감
  try{ const el = document.getElementById('cam'); if(el.requestFullscreen) await el.requestFullscreen({ navigationUI:'hide' }); }catch(_){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){}
}
function camUnlock(){ try{ screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(_){} try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(_){} }

async function openCamera(job, cell, statCell){
  const box = document.getElementById('cam'), v = document.getElementById('camVideo');
  cam = { job, cell, statCell, stream:null, ic:null, shots:[], cur:'', direct:null };
  camApplySide(); camRenderKeys(); camInfo();
  directPrepare();
  box.classList.add('show');
  camLockLandscape();
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('이 브라우저는 카메라를 지원하지 않습니다');
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:4096 }, height:{ ideal:3072 } }, audio:false });
    cam.stream = stream; v.srcObject = stream;
    try{ await v.play(); }catch(_){}
    if(window.ImageCapture){ try{ cam.ic = new ImageCapture(stream.getVideoTracks()[0]); }catch(_){ cam.ic = null; } }   // 안드로이드: 원본 해상도 촬영
  }catch(e){
    camStop(); box.classList.remove('show'); cam = null;
    toast('카메라를 열 수 없어 사진첩에서 고릅니다 (' + e.message + ')');
    shootPhoto(job, cell, statCell);
  }
}
function camStop(){ try{ cam && cam.stream && cam.stream.getTracks().forEach(t => t.stop()); }catch(_){} const v = document.getElementById('camVideo'); if(v) v.srcObject = null; camUnlock(); }
function camRenderKeys(){
  const k = document.getElementById('camKeys'); if(!cam) return;
  const lit = new Set((guidePanels || []).map(p => String(p).toUpperCase()));
  k.innerHTML = PANELS.map(p => {
    const n = cam.shots.filter(s => s.cell === p).length;
    return `<button type="button" class="key${lit.has(p) ? ' on' : ''}${cam.cur === p ? ' cur' : ''}" data-p="${p}">${p}${n ? `<span class="n${n >= MIN_SHOTS ? ' ok' : ''}">${n}</span>` : ''}</button>`;
  }).join('');
  k.querySelectorAll('.key').forEach(b => b.onclick = () => { cam.cur = b.dataset.p; camRenderKeys(); camInfo(); });
}
function camInfo(){
  if(!cam) return;
  const n = cam.shots.filter(s => s.cell === cam.cur).length, total = cam.shots.length;
  let dt = '';
  if(cam.direct){ const ok = cam.shots.filter(s => s.dst === 'ok').length, bad = cam.shots.filter(s => s.dst === 'fail').length;
    dt = ` · PC ${ok}/${total}` + (bad ? ` (실패 ${bad})` : ''); }
  document.getElementById('camInfo').textContent = (cam.cur ? `매대 ${cam.cur}: ${n}장 (3장 이상)` : '매대를 누르고 찍으세요') + ` · 전체 ${total}장` + dt;
  document.getElementById('camSend').textContent = total ? `SEND  (${total}장)` : 'SEND';
}
async function camShoot(){
  if(!cam || !cam.stream) return;
  const v = document.getElementById('camVideo'), f = document.getElementById('camFlash');
  f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 120);
  let blob = null;
  if(cam.ic){ try{ blob = await cam.ic.takePhoto(); }catch(_){ blob = null; } }
  if(!blob){
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    if(!c.width){ toast('카메라 준비 중입니다. 잠시 뒤 다시 누르세요'); return; }
    c.getContext('2d').drawImage(v, 0, 0);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  }
  const sc = await sharpness(blob);
  if(sc >= 0 && sc < BLUR_MIN){
    cam.blur = (cam.blur || 0) + 1;
    try{ navigator.vibrate && navigator.vibrate([80, 60, 80]); }catch(_){}
    if(cam.blur < 3){ toast(`흐려서 버렸습니다 (선명도 ${Math.round(sc)}) — 다시 찍어 주세요`); return; }
    toast(`흐림 의심이지만 보관합니다 (${Math.round(sc)}) — PC 판독에서 다시 거릅니다`);
  } else cam.blur = 0;
  const shot = { blob, mime: blob.type || 'image/jpeg', cell: cam.cur, sharp: sc };
  cam.shots.push(shot);
  if(cam.direct) directQueue(cam.direct, shot);
  camRenderKeys(); camInfo();
}
document.getElementById('camShot').onclick = camShoot;
document.getElementById('camClose').onclick = () => {
  if(!cam) return;
  if(cam.shots.length && !confirm(`찍어 둔 ${cam.shots.length}장을 버리고 닫을까요?`)) return;
  camStop(); document.getElementById('cam').classList.remove('show'); cam = null;
};
document.getElementById('camSend').onclick = async () => {
  if(!cam) return;
  if(!cam.shots.length){ toast('찍은 사진이 없습니다'); return; }
  const short = PANELS.filter(p => { const n = cam.shots.filter(s => s.cell === p).length; return n && n < MIN_SHOTS; });
  if(short.length && !confirm(`매대 ${short.join(', ')} 은 ${MIN_SHOTS}장이 안 됩니다. 그래도 전송할까요?`)) return;
  if(!confirm(`${cam.shots.length}장을 전송할까요?`)) return;
  const { job, cell, statCell, shots, direct } = cam;
  camStop(); document.getElementById('cam').classList.remove('show'); cam = null;
  if(direct) await directSend(job, cell, statCell, shots, direct);
  else await uploadStockPhotos(job, cell, statCell, shots);
};

// 사진첩 선택 (카메라를 못 열 때의 대체 경로). 여러 장 선택 가능, 매대 글자는 안 붙음
function shootPhoto(job, cell, statCell){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const files = [...(inp.files || [])]; inp.remove();
    if(!files.length) return;
    await uploadStockPhotos(job, cell, statCell, files.map(f => ({ blob: f, mime: f.type || 'image/jpeg', cell: '' })));
  };
  inp.click();
}

// 찍어 둔 사진을 순차 업로드("n/N" 칩) → 드라이브 4_재고체크사진 + [재고체크사진] 탭 → 끝나면 STOCK_AI 등록
async function uploadStockPhotos(job, cell, statCell, shots){
  const btn = cell.querySelector('button.btn'); btn.disabled = true;
  const stat = statCell.querySelector('.stat'); uploading[job['작업코드']] = true; delete photoErr[job['작업코드']];
  const prev = stat.innerHTML; let okN = 0; const fails = [];
  for(let i = 0; i < shots.length; i++){
    const s = shots[i];
    stat.innerHTML = `<span class="chip"><span class="st 실행중">업로드 ${i + 1}/${shots.length}</span></span>` + prev;
    try{
      const data = await toBase64(s.blob);   // 원본 그대로. 15MB 넘으면 서버가 거절
      const res = await api({}, { action:'upload', code: job['작업코드'], mime: s.mime, data, cell: s.cell || '' });
      if(res.ok){ okN++; mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); }
      else fails.push(`${i + 1}번째: ${res.error || '알 수 없는 오류'}`);
    }catch(e){ fails.push(`${i + 1}번째: 전송 실패 (${e.message})`); }
  }
  if(fails.length) photoErr[job['작업코드']] = fails.join(' / ');
  toast(fails.length ? `${okN}장 저장, ${fails.length}장 실패 — ${fails[0]}` : `${okN}장 저장 완료 — PC 에 AI 판독을 요청합니다`);
  if(okN) await enqueueAI();   // PC 러너가 사진을 정리·판정 → [빈칸코드]. 결과 칩은 「A_2 빈칸 판독 및 적용」 줄
  delete uploading[job['작업코드']]; btn.disabled = false;
  refreshStatus();
}

// ---------- 직통 시험 (2026-10-20) ----------
// PC(사무실)의 사진 수신 서버(photo_server.py)가 Cloudflare 터널 주소를 시트에 알려 두면(jobs 응답 tunnel),
// 카메라에서 찍는 즉시 그 주소로 원본을 올린다 → PC 가 찍는 동안 판독을 시작 → SEND 하면 남은 것만 마무리.
// 스위치가 꺼져 있거나 PC 가 안 보이면 예전 그대로(드라이브 업로드 → STOCK_AI). 직통이 실패한 사진만 드라이브로 다시 보낸다
let tunnelInfo = null;
function directWanted(){ try{ return localStorage.getItem('camDirect') === '1'; }catch(_){ return false; } }
function directBtn(state, text){
  const b = document.getElementById('camDirect'); if(!b) return;
  b.classList.toggle('on', state === 'on'); b.classList.toggle('bad', state === 'bad'); b.textContent = text;
}
async function fetchT(url, opt, ms){
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  try{ return await fetch(url, Object.assign({}, opt || {}, { signal: ac.signal })); } finally { clearTimeout(t); }
}
async function directPrepare(){
  if(!cam) return;
  cam.direct = null;
  if(!directWanted()){ directBtn('', '직통 꺼짐'); return; }
  directBtn('', '직통 확인 중…');
  const me = cam;
  try{
    const res = await api({ action:'jobs' });            // 터널 주소는 PC 를 다시 켜면 바뀌므로 카메라 열 때 새로 읽음
    if(res && res.ok) tunnelInfo = res.tunnel || null;
  }catch(_){}
  const url = tunnelInfo && tunnelInfo.url ? String(tunnelInfo.url).replace(/\/+$/, '') : '';
  if(!url){ if(me === cam) directBtn('bad', '직통 안 됨 (PC 주소 없음)'); return; }
  try{
    const r = await fetchT(url + '/ping', {}, 5000); const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'ping');
    if(me !== cam || me.shots.length) return;           // 확인하는 사이 닫았거나 이미 찍기 시작했으면 이번엔 드라이브 경로
    cam.direct = { url, sid: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), chain: Promise.resolve() };
    directBtn('on', '직통 켜짐 (PC ' + (j.runner || '') + ')');
  }catch(e){ if(me === cam) directBtn('bad', '직통 안 됨 (PC 응답 없음)'); }
  camInfo();
}
document.getElementById('camDirect').onclick = () => {
  if(!cam) return;
  if(cam.shots.length){ toast('찍기 시작한 뒤에는 바꿀 수 없습니다 (닫고 다시 여세요)'); return; }
  try{ localStorage.setItem('camDirect', directWanted() ? '0' : '1'); }catch(_){}
  directPrepare();
};
async function toJpeg(blob){   // 일부 기기는 PNG 로 찍힘 → 같은 해상도 JPEG(0.95)로 바꿔 보낸다 (PC 는 jpg 만 받음)
  const bm = await createImageBitmap(blob);
  const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
  c.getContext('2d').drawImage(bm, 0, 0); if(bm.close) bm.close();
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95)); c.width = c.height = 1;
  if(!out) throw new Error('jpg 변환 실패'); return out;
}
async function directUpOne(d, s){
  s.dst = 'up';
  try{
    if(!s.jpg) s.jpg = /jpe?g/i.test(s.mime || 'image/jpeg') ? s.blob : await toJpeg(s.blob);
    const r = await fetchT(d.url + '/upload', { method:'POST', body: s.jpg,
      headers:{ 'Content-Type':'image/jpeg', 'X-Token': cfg.token, 'X-Session': d.sid, 'X-Panel': s.cell || '' } }, 90000);
    const j = await r.json();
    if(j.ok){ s.dst = 'ok'; s.dname = j.name; } else { s.dst = 'fail'; s.derr = j.error || ('HTTP ' + r.status); }
  }catch(e){ s.dst = 'fail'; s.derr = e.name === 'AbortError' ? '시간 초과' : e.message; }
}
function directQueue(d, s){   // 한 장씩 차례로 (찍는 동안 휴대폰 회선을 나눠 쓰지 않게)
  s.dst = 'wait';
  d.chain = d.chain.then(() => directUpOne(d, s)).then(() => { if(cam && cam.direct === d) camInfo(); });
}
async function directSend(job, cell, statCell, shots, d){
  const code = job['작업코드'], btn = cell.querySelector('button.btn'), stat = statCell.querySelector('.stat');
  btn.disabled = true; uploading[code] = true; delete photoErr[code];
  const prev = stat.innerHTML;
  const chip = t => { stat.innerHTML = `<span class="chip"><span class="st 실행중">${t}</span></span>` + prev; };
  const t0 = Date.now();
  try{
    chip('직통 전송 마무리…');
    await d.chain;
    for(const s of shots.filter(s => s.dst !== 'ok')){ chip('직통 다시 보내기…'); await directUpOne(d, s); }   // 실패분 한 번 더
    const left = shots.filter(s => s.dst !== 'ok'), okN = shots.length - left.length;
    let finished = false;
    if(okN){
      try{
        const r = await fetchT(d.url + '/finish', { method:'POST', body:'{}', headers:{ 'Content-Type':'text/plain', 'X-Token': cfg.token, 'X-Session': d.sid } }, 20000);
        const j = await r.json(); finished = !!j.ok; if(!j.ok) photoErr[code] = '직통 마무리 실패: ' + (j.error || '');
      }catch(e){ photoErr[code] = '직통 마무리 실패: ' + e.message; }
    }
    if(left.length || !finished){
      // 직통 못 한 사진은 드라이브로 → STOCK_AI. 직통으로 이미 PC 에 간 사진도 마무리가 안 됐으면 STOCK_AI 가 시트 목록에서 이어 받는다
      toast(left.length ? `직통 실패 ${left.length}장 — 드라이브로 보냅니다 (${left[0].derr || ''})` : '직통 마무리 실패 — PC 러너 판독으로 넘깁니다');
      delete uploading[code]; btn.disabled = false; stat.innerHTML = prev;
      if(left.length) await uploadStockPhotos(job, cell, statCell, left);
      else { await enqueueAI(); refreshStatus(); }
      return;
    }
    toast(`${okN}장 직통 전송 완료 — PC 가 마무리 판독 중`);
    for(let guard = 0; guard < 400; guard++){   // 3초 간격, 최대 20분
      await new Promise(r => setTimeout(r, 3000));
      let j = null;
      try{ const r = await fetchT(d.url + '/status?session=' + encodeURIComponent(d.sid), { headers:{ 'X-Token': cfg.token } }, 15000); j = await r.json(); }catch(_){ j = null; }
      const sec = Math.round((Date.now() - t0) / 1000);
      if(!j){ chip(`직통 판독 확인 중… ${sec}초`); continue; }
      if(!j.ok){ photoErr[code] = '직통: ' + (j.error || ''); break; }
      if(j.stage === '완료'){
        const n = (j.result && j.result.n) || {};
        toast(`직통 판독 완료 (SEND 후 ${sec}초) — 빈칸 ${n.empty || 0} / 있음 ${n.filled || 0} / 불확실 ${n.unsure || 0}`);
        break;
      }
      if(String(j.stage || '').startsWith('실패')){ photoErr[code] = '직통 ' + j.stage + ' — A_2 로 다시 판독하세요'; toast(photoErr[code]); break; }
      chip(`직통 ${j.stage || ''} ${j.done || 0}/${j.photos || 0} · ${sec}초`);
    }
  }finally{
    delete uploading[code]; btn.disabled = false; refreshStatus();
  }
}

const STOCK_AI_CODE = 'STOCK_AI';
async function enqueueAI(){
  try{
    const res = await api({}, { action:'enqueue', code: STOCK_AI_CODE, params:{} });
    if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); toast('AI 판독 요청 등록 — PC 러너가 곧 처리합니다 (「AI 빈칸 판독」 줄 참고)'); }
    else toast('AI 판독 요청 실패: ' + (res.error || ''));
  }catch(e){ toast('AI 판독 요청 실패: ' + e.message); }
}

// {action:'aiNext'} 를 done 이 될 때까지 반복. 칩에 "AI 판독 n/N" 진행 표시, 끝나면 빈칸 합계 토스트
async function aiLoop(job, stat, prev){
  let k = 0, total = null, empty = 0, filled = 0, unsure = 0, errs = [];
  for(let guard = 0; guard < 60; guard++){
    stat.innerHTML = `<span class="chip"><span class="st 실행중">AI 판독 ${k + 1}${total ? '/' + total : ''}</span></span>` + prev;
    let res;
    try{ res = await api({}, { action:'aiNext' }); }
    catch(e){ errs.push('전송 실패: ' + e.message); break; }
    if(!res.ok){ errs.push(res.error || '알 수 없는 오류'); if(/미설정/.test(res.error || '') || res.remaining === undefined) break; k++; continue; }
    if(res.done) break;
    if(res.skipped) continue;
    k++; if(total === null) total = k + (res.remaining || 0);
    empty += res.empty || 0; filled += res.filled || 0; unsure += res.unsure || 0;
  }
  if(errs.length) photoErr[job['작업코드']] = 'AI: ' + errs[0];
  toast(k ? `AI 판독 ${k}장 완료 — 빈칸 ${empty} / 있음 ${filled} / 불확실 ${unsure}${errs.length ? ' (오류 ' + errs.length + '건)' : ''}` : (errs[0] ? 'AI 판독 안 됨: ' + errs[0] : 'AI 판독할 사진 없음'));
}

// 사진 자르기: 가로 10 : 세로 7 틀을 띄워 위치·확대를 맞춘 뒤 그 부분만 잘라낸다 (긴 변 2000px 이하)
// 브라우저가 못 읽는 형식(HEIC 등)은 자르지 못하므로 원본 그대로 올린다
const CROP_W = 10, CROP_H = 7;
function cropPhoto(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const box = document.getElementById('crop'), view = document.getElementById('cropView');
    const img = document.getElementById('cropImg'), zoom = document.getElementById('cropZoom');
    const raw = () => resolve({ blob: file, mime: file.type || 'image/jpeg' });
    img.onerror = () => { URL.revokeObjectURL(url); toast('이 사진 형식은 자르기를 지원하지 않아 원본으로 올립니다'); raw(); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      box.classList.add('show');
      const vw = view.clientWidth, vh = view.clientHeight;
      const base = Math.max(vw / iw, vh / ih);      // 틀을 꽉 채우는 최소 배율
      let s = 1, x = 0, y = 0;                       // s = 확대, (x,y) = 사진 중심이 틀 중심에서 벗어난 거리(px)
      zoom.value = 1;
      const draw = () => {
        const dw = iw * base * s, dh = ih * base * s;
        x = Math.max(-(dw - vw) / 2, Math.min((dw - vw) / 2, x));
        y = Math.max(-(dh - vh) / 2, Math.min((dh - vh) / 2, y));
        img.style.width = dw + 'px'; img.style.height = dh + 'px';
        img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      };
      draw();
      const pts = new Map(); let pinch = 0;
      const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
      view.onpointerdown = e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); if(pts.size === 2) pinch = dist(); };
      view.onpointermove = e => {
        const p = pts.get(e.pointerId); if(!p) return;
        if(pts.size === 1){ x += e.clientX - p.x; y += e.clientY - p.y; }
        p.x = e.clientX; p.y = e.clientY;
        if(pts.size === 2){ const d = dist(); if(pinch){ s = Math.max(1, Math.min(4, s * d / pinch)); zoom.value = s; } pinch = d; }
        draw();
      };
      view.onpointerup = view.onpointercancel = e => { pts.delete(e.pointerId); pinch = 0; };
      zoom.oninput = () => { s = Number(zoom.value); draw(); };
      const close = () => { box.classList.remove('show'); URL.revokeObjectURL(url); view.onpointerdown = view.onpointermove = view.onpointerup = view.onpointercancel = null; };
      document.getElementById('cropNo').onclick = () => { close(); resolve(null); };
      document.getElementById('cropOk').onclick = () => {
        const k = base * s, sw = vw / k, sh = vh / k;
        const sx = iw / 2 - x / k - sw / 2, sy = ih / 2 - y / k - sh / 2;
        const ow = Math.round(Math.min(sw, PHOTO_MAX_EDGE)), oh = Math.round(ow * CROP_H / CROP_W);
        try{
          const c = document.createElement('canvas'); c.width = ow; c.height = oh;
          c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, ow, oh);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          c.toBlob(b => { close(); b ? resolve({ blob: b, mime }) : raw(); }, mime, PHOTO_QUALITY);
        }catch(_){ close(); raw(); }
      };
    };
    img.src = url;
  });
}

// 사진을 긴 변 maxEdge 이하로 줄여 JPEG 로 (PNG 는 PNG 유지). 브라우저가 못 읽는 형식(HEIC 등)은 원본 그대로 올린다 (재고체크 사진촬영에서 사용)
function shrinkImage(file, maxEdge = PHOTO_MAX_EDGE, quality = PHOTO_QUALITY){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h);
      const s = m > maxEdge ? maxEdge / m : 1;
      const cw = Math.round(w * s), ch = Math.round(h * s);
      try{
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        c.toBlob(b => resolve(b ? { blob: b, mime } : { blob: file, mime: file.type || 'image/jpeg' }), mime, quality);
      }catch(_){ resolve({ blob: file, mime: file.type || 'image/jpeg' }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ blob: file, mime: file.type || 'image/jpeg' }); };
    img.src = url;
  });
}
function toBase64(blob){
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('파일 읽기 실패')); r.readAsDataURL(blob); });
}

// 러너 생존 표시: 60초 이내 접속이면 켜짐
// 2026-10-18 2대 운영: 서버(v14)가 runners:{사무실:ms, 집:ms} 를 주면 러너별로 ● 켜짐 / ◐ 작업중 / ○ 꺼짐 을 나란히 표시
function showRunner(seen, busy, runners, queue){
  const el = document.getElementById('runner'); if(!el) return;
  if(runners && Object.keys(runners).length){
    const names = ['사무실', '집']; Object.keys(runners).forEach(n => { if(!names.includes(n)) names.push(n); });
    const busyBy = {}; (queue || []).forEach(q => { if(q['상태']==='실행중' || q['상태']==='중지요청') busyBy[q['러너'] || '사무실'] = true; });
    el.textContent = ''; let anyOn = false;
    names.forEach(n => {
      const s = runners[n]; const ago = s ? (Date.now() - Number(s)) / 1000 : Infinity;
      const st = busyBy[n] ? 'busy' : (ago < 60 ? 'on' : 'off'); if(st !== 'off') anyOn = true;
      const sp = document.createElement('span'); sp.className = 'r ' + st;
      sp.textContent = (st === 'busy' ? '◐ ' : st === 'on' ? '● ' : '○ ') + n;
      sp.title = n + (st === 'busy' ? ' 러너 작업 실행 중' : st === 'on' ? ' 러너 켜짐' : (s ? ' 러너 꺼짐 · 마지막 ' + fmt(new Date(Number(s)).toISOString()) : ' 러너 꺼짐'));
      el.appendChild(sp);
    });
    el.className = 'runner ' + (anyOn ? 'on' : 'off');
    return;
  }
  const ago = seen ? (Date.now() - Number(seen)) / 1000 : Infinity;
  if(busy){ el.className = 'runner on'; el.textContent = '● PC 러너 작업 실행 중'; }
  else if(ago < 60){ el.className = 'runner on'; el.textContent = '● PC 러너 켜짐'; }
  else { el.className = 'runner off'; el.textContent = seen ? `○ PC 러너 꺼짐 · 마지막 ${fmt(new Date(Number(seen)).toISOString())}` : '○ PC 러너 꺼짐'; }
}

// 시트 날짜는 UTC ISO 문자열로 오므로 한국 시간 HH:MM 으로 표시
function fmt(v){
  if(!v) return '';
  const d = new Date(v); if(isNaN(d)) return String(v).slice(11,16);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 파일 이름을 짧게: "(F_1) PC_LIST - 1007.xlsm" → "(F_1) 1007". 앞머리 괄호가 없으면 확장자만 뗀 이름 그대로
function shortName(n){
  const base = String(n).replace(/\.[^.]+$/, '').trim();
  const head = base.match(/^\s*(\([^)]*\))/);
  if(!head) return base;
  const date = base.match(/(\d{4,8})\s*$/);
  return date ? `${head[1]} ${date[1]}` : head[1];
}

// 칩 1개: 상태 배지 + 시각(대기·실행중은 누른 시각, 끝난 건은 완료 시각) + 파일 + 우측 상단 X
function chipHtml(q){
  const st = q['상태'];
  const running = (st==='실행중' || st==='중지요청'), waiting = (st==='대기');
  const when = (waiting || running) ? q['요청시각'] : (q['종료시각'] || q['요청시각']);
  const day = (() => { const d = new Date(when); if(isNaN(d)) return ''; const t = new Date(); return (d.toDateString() === t.toDateString()) ? '' : `${d.getMonth()+1}/${d.getDate()} `; })();
  const range = (() => { try { const o = JSON.parse(q['파라미터']||'{}'); return o.range === 'week' ? ' 일주일' : (o.range === 'today' ? ' 오늘' : ''); } catch(_) { return ''; } })();
  const names = String(q['결과파일']||'').split('\n').filter(Boolean);
  const links = String(q['결과링크']||'').split('\n').filter(Boolean);
  const files = names.map((n,i) => links[i]
    ? `<a href="${esc(links[i])}" target="_blank" title="${esc(n)}">${esc(shortName(n))}</a>`
    : `<span title="${esc(n)} (드라이브 동기화 중)">${esc(shortName(n))}</span>`).join('');
  const xTitle = waiting ? '대기 취소' : (running ? '실행 중지' : '표시 지우기');
  return `<span class="chip ${esc(st)}"><span class="b"><span class="st ${esc(st)}">${esc(st)}</span><button class="x" data-id="${esc(q['ID'])}" data-st="${esc(st)}" title="${xTitle}">×</button><span class="t">${day}${fmt(when)}${range}</span></span>${files?`<span class="files">${files}</span>`:''}</span>`;
}

// 사진 업로드(STOCK_PHOTO)처럼 한 번에 여러 건이 쌓이는 작업은 끝난 건을 한 덩어리 칩으로: [완료 ×] 15:13~16:29 · 사진 16장 (X 하나로 전부 지움)
//   (2026-10-16 사장님: 사진 개수대로 파일명이 붙으면 보기 안 좋고 지우기도 번거롭다 — 한 장씩 지울 일은 없음)
const GROUPED = { STOCK_PHOTO: '사진' };
function chipsHtml(code, list){
  const unit = GROUPED[code];
  if(!unit) return list.map(chipHtml).join('');
  const done = list.filter(q => !['대기','실행중','중지요청'].includes(q['상태']));
  const rest = list.filter(q => ['대기','실행중','중지요청'].includes(q['상태']));
  let html = '';
  if(done.length){
    const times = done.map(q => q['종료시각'] || q['요청시각']).filter(Boolean).sort();
    const first = fmt(times[0]), last = fmt(times[times.length-1]);
    const when = (first && last && first !== last) ? `${first}~${last}` : (last || first);
    const bad = done.filter(q => q['상태'] !== '완료').length;
    const st = bad ? '실패' : '완료';
    const label = bad ? `${unit} ${done.length}장 (실패 ${bad})` : `${unit} ${done.length}장`;
    html += `<span class="chip ${st}"><span class="b"><span class="st ${st}">${st}</span><button class="x" data-ids="${esc(done.map(q => q['ID']).join(','))}" title="${unit} 기록 모두 지우기">×</button><span class="t">${when}</span></span><span class="files"><span>${esc(label)}</span></span></span>`;
  }
  return html + rest.map(chipHtml).join('');
}
// X 를 누르면 서버 응답을 기다리지 않고 칩을 바로 지운다(2026-10-16 사장님: 지워지는 반응이 느림).
// 서버 삭제가 끝나기 전에 주기 갱신이 돌아도 되살아나지 않게 60초 동안 숨김 목록에 둔다
const hiddenIds = new Map();   // id → 숨김 만료 시각(ms)
function hideNow(ids){ const until = Date.now() + 60000; ids.forEach(id => hiddenIds.set(id, until)); document.querySelectorAll('.chip .x').forEach(x => { const mine = x.dataset.ids ? x.dataset.ids.split(',') : [x.dataset.id]; if(mine.some(id => ids.includes(id))) x.closest('.chip').remove(); }); }
function isHidden(id){ const t = hiddenIds.get(id); if(!t) return false; if(Date.now() > t){ hiddenIds.delete(id); return false; } return true; }

async function cancelMany(ids){
  if(!confirm(`기록 ${ids.length}건 표시를 지울까요?`)) return;
  hideNow(ids);
  try{
    const rs = await Promise.all(ids.map(id => api({}, {action:'cancel', id}).catch(e => ({ok:false, error:e.message}))));
    const bad = rs.filter(r => !r.ok).length;
    if(bad){ toast(`${bad}건은 못 지웠습니다`); ids.forEach(id => hiddenIds.delete(id)); refreshStatus(); }
  }catch(e){ toast('요청 실패: '+e.message); ids.forEach(id => hiddenIds.delete(id)); refreshStatus(); }
}

// X 버튼: 대기 → 취소 / 실행중 → PC 러너에 중지 요청 / 끝난 건 → 표시 삭제
async function cancelJob(id, st, code){
  const running = (st==='실행중' || st==='중지요청');
  if(running){ if(!confirm('실행 중인 작업을 중지할까요?\n(PC 에서 돌고 있는 프로그램을 강제로 끝냅니다)')) return; }
  else hideNow([id]);                       // 대기 취소·표시 지우기는 바로 화면에서 제거
  try{
    const res = await api({}, {action:'cancel', id});
    if(!res.ok){ toast('실패: '+res.error); hiddenIds.delete(id); refreshStatus(); return; }
    if(running){ toast(res.result==='중지요청' ? '중지 요청 — PC 러너가 곧 끊습니다 (안 멈추면 X 를 한 번 더)' : '강제 종료 처리됨'); refreshStatus(); }
  }catch(e){ toast('요청 실패: '+e.message); hiddenIds.delete(id); refreshStatus(); }
}

// 작업코드별 오늘 건을 같은 줄 오른쪽에 칩으로 (시트는 작업별 마지막 결과 1건 + 대기·실행중만 남긴다)
async function refreshStatus(){
  try{
    const res = await api({action:'queue', n:50});
    if(!res.ok) return;
    showRunner(res.runner_seen, res.runner_busy, res.runners, res.queue);
    // 작업코드별로 오늘 건을 시간순(먼저 누른 것이 앞)으로 모두 칩으로 표시: [완료 12:28 파일] [실행중 13:57 ×] [대기 14:04 ×] [대기 14:09 ×]
    const byCode = {};
    res.queue.slice().reverse().forEach(q => { if(q['상태']==='취소' || isHidden(q['ID'])) return; (byCode[q['작업코드']] = byCode[q['작업코드']] || []).push(q); });
    document.querySelectorAll('.stat').forEach(el => {
      if(uploading[el.dataset.code]) return;
      const list = byCode[el.dataset.code] || [];
      const err = photoErr[el.dataset.code];
      el.innerHTML = chipsHtml(el.dataset.code, list) + (err ? `<span class="chip"><span class="st 실패">업로드 실패</span><span class="uperr">${esc(err)}</span></span>` : '');
      el.querySelectorAll('.x').forEach(x => x.onclick = () => x.dataset.ids ? cancelMany(x.dataset.ids.split(',')) : cancelJob(x.dataset.id, x.dataset.st, el.dataset.code));
    });
    document.querySelectorAll('.lastRefresh').forEach(lr => lr.textContent = '· ' + new Date().toLocaleTimeString('ko-KR') + ' 갱신');
  }catch(_){}
}
init();
