<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="원격 실행">
<title>원격 실행 보드</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --txt:#1f2328; --sub:#6b7280; --pri:#2563eb; --ok:#16a34a; --bad:#dc2626; --run:#d97706; --wait:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#111827; color:#fff; padding:14px 20px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:18px; margin:0; cursor:pointer; }
  header .runner { margin-left:auto; font-size:12.5px; padding:3px 10px; border-radius:999px; background:#374151; color:#e5e7eb; }
  header .runner.on { background:#065f46; color:#d1fae5; }
  header .runner.off { background:#7f1d1d; color:#fee2e2; }
  header .who { font-size:13px; color:#cbd5e1; }
  header button { background:#374151; color:#fff; border:0; border-radius:6px; padding:6px 10px; cursor:pointer; }

  /* 왼쪽(작업)과 오른쪽(진행 상황)을 한 격자로 묶어 줄 높이를 맞춘다 */
  #board { max-width:1100px; margin:0 auto; padding:16px; }
  /* 구역(주문/재고, 상품 …)마다 격자 하나: 왼쪽 = 검은 제목 띠 + 작업, 오른쪽 = 진행 상황 */
  .sec { display:grid; grid-template-columns: 420px minmax(0,1fr); column-gap:14px; margin-bottom:44px; }
  .L.head { background:#111827; color:#fff; border:1px solid #111827; border-radius:10px 10px 0 0; padding:10px 18px; display:flex; align-items:center; }
  .L.head h2 { font-size:26px; margin:0; font-weight:700; letter-spacing:1px; }
  .L.pad, .R.pad { height:6px; }
  .L, .R { background:var(--card); border-left:1px solid var(--line); border-right:1px solid var(--line); padding:0 14px; min-width:0; }
  .top { border-top:1px solid var(--line); border-radius:10px 10px 0 0; padding-top:12px; }
  .bot { border-bottom:1px solid var(--line); border-radius:0 0 10px 10px; height:12px; }
  .top h2 { font-size:14px; margin:0 0 6px; color:#374151; }
  .gh h3 { font-size:13px; margin:8px 0 2px; color:#111827; border-left:3px solid var(--pri); padding-left:7px; }
  .R.gh h3 { visibility:hidden; }
  /* 소제목 줄: 왼쪽 = 소제목 (+ 그룹 전체 실행 버튼), 오른쪽 = 그 버튼의 진행 상황. 두 번째 소제목부터는 위에 여백을 둔다 */
  .L.gh { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .L.gh .btn { background:#111827; color:#fff; }   /* 그룹 전체 버튼은 검은 바탕·흰 글씨 */
  .L.gh .btn:hover { background:#374151; }
  .gh.sp { padding-top:22px; }
  .R.gh .job { border-bottom:0; min-height:0; padding:6px 0 0; }
  .job { display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--line); min-height:38px; }
  .lastrow .job { border-bottom:0; }
  .L .name { flex:1; font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .L .desc { color:var(--sub); font-size:11.5px; display:inline; margin-left:6px; }
  .L .ctl { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .L .job.haspar { flex-wrap:wrap; }
  .L .job.haspar .name { flex:1 1 100%; }
  .L .job.haspar .ctl { margin-left:auto; }
  .L input[type=text] { padding:5px; border:1px solid var(--line); border-radius:6px; font-size:12.5px; width:160px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { background:#fff; color:var(--txt); border:0; padding:5px 10px; font-size:12.5px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:#e0e7ff; color:#1e3a8a; font-weight:600; }
  .btn { background:#9ca3af; color:#fff; border:0; border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px; white-space:nowrap; }   /* 적용 버튼 = 회색 (진한 회색에서 3톤 밝게) */
  .btn:hover { background:#6b7280; }
  .btn:disabled { background:#9ca3af; cursor:not-allowed; }

  .R .job { font-size:12.5px; color:var(--sub); white-space:nowrap; overflow-x:auto; overflow-y:hidden; gap:6px; scrollbar-width:none; }
  .R .job::-webkit-scrollbar { display:none; }
  .R .time { color:var(--txt); }
  /* 결과 파일 = 상태 배지와 같은 알약 모양. 이름은 "(F_1) 1007" 처럼 앞머리+날짜만 (전체 이름은 길게 누르거나 마우스를 올리면 보임) */
  .R .files { display:flex; flex-wrap:wrap; gap:4px; min-width:0; }
  .R .files a, .R .files span { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; color:#fff; background:var(--pri); text-decoration:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:160px; }
  .R .files a:hover { background:#1d4ed8; }
  .R .files span { background:#cbd5e1; color:#374151; }   /* 드라이브 동기화 전(링크 없음) */
  .st { display:inline-block; padding:1px 7px; border-radius:999px; color:#fff; font-size:11px; background:#9ca3af; }
  .st.대기 { background:var(--wait);} .st.실행중, .st.중지요청 { background:var(--run);} .st.완료 { background:var(--ok);} .st.실패 { background:var(--bad);} .st.취소, .st.중지 { background:#cbd5e1; color:#374151; }
  /* 상태 칩 = [배지 / 그 아래 작은 시각] (+ 파일). 배지 우측 상단에 반쯤 걸친 동그란 X (누르면 취소·중지·표시 지우기) */
  .chip { display:inline-flex; align-items:flex-start; gap:6px; padding:4px 0 2px; margin-right:10px; white-space:nowrap; max-width:100%; }
  .L .job, .R .job { height:100%; }   /* 오른쪽 칩이 줄바꿈돼 줄이 높아져도 양쪽 내용이 세로 가운데 */
  .chip .b { position:relative; display:inline-flex; flex-direction:column; align-items:center; padding-right:5px; }
  .chip .x { position:absolute; top:-6px; right:-2px; width:14px; height:14px; border-radius:50%; border:1px solid #fff; background:#374151; color:#fff; font-size:10px; line-height:12px; text-align:center; cursor:pointer; padding:0; }
  .chip .x:hover { background:var(--bad); }
  .chip.실행중 .x, .chip.중지요청 .x { background:var(--bad); }
  .chip .t { display:block; color:var(--sub); font-size:10px; line-height:12px; margin-top:2px; }
  .uperr { color:var(--bad); font-size:11px; white-space:normal; word-break:break-all; }
  .chip.중지요청 .st::after { content:' → 중지 중'; }

  /* 사진 자르기 화면: 10:7 틀 안에서 사진을 끌어 위치를 맞추고, 슬라이더·두 손가락으로 확대 */
  #crop { position:fixed; inset:0; background:rgba(17,24,39,.92); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:16px; }
  #crop.show { display:flex; }
  #crop .tip { color:#e5e7eb; font-size:13px; }
  #cropView { position:relative; width:min(92vw,640px); aspect-ratio:10/7; overflow:hidden; background:#000; border:2px solid #fff; border-radius:6px; touch-action:none; cursor:grab; }
  #cropView img { position:absolute; left:50%; top:50%; max-width:none; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  /* 가이드 라인: 3등분 선 + 가운데 십자 */
  #cropView .guide { position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(to right, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)),
      linear-gradient(to bottom, transparent calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% - .5px), rgba(255,255,255,.55) calc(33.333% + .5px), transparent calc(33.333% + .5px), transparent calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% - .5px), rgba(255,255,255,.55) calc(66.666% + .5px), transparent calc(66.666% + .5px)); }
  #cropView .guide::before, #cropView .guide::after { content:''; position:absolute; left:50%; top:50%; background:#ef4444; transform:translate(-50%,-50%); }
  #cropView .guide::before { width:22px; height:2px; } #cropView .guide::after { width:2px; height:22px; }
  #crop input[type=range] { width:min(80vw,420px); }
  #crop .row { display:flex; gap:10px; }
  #crop .row button { border:0; border-radius:8px; padding:10px 22px; font-size:14px; cursor:pointer; }
  #crop .ok { background:var(--pri); color:#fff; } #crop .no { background:#374151; color:#fff; }

  #setup { max-width:520px; margin:60px auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  #setup h2 { font-size:15px; margin:0 0 12px; color:#374151; }
  #setup input { width:100%; padding:9px; margin:6px 0 12px; border:1px solid var(--line); border-radius:6px; }
  .hint { color:var(--sub); font-size:12px; }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; }
  .toast.show { opacity:1; }

  /* 좁은 화면(휴대폰): PC 와 같은 두 칸 배치를 유지하고 크기만 줄인다 */
  @media (max-width:700px){
    #board { padding:8px; }
    .sec { grid-template-columns: minmax(0,1.35fr) minmax(0,1fr); column-gap:8px; margin-bottom:28px; }
    .L.head { padding:8px 10px; }
    .L.head h2 { font-size:19px; letter-spacing:0; }
    .L, .R { padding:0 8px; }
    .top { padding-top:10px; }
    .top h2 { font-size:13px; }
    .gh h3 { font-size:12px; margin:6px 0 2px; }
    .gh.sp { padding-top:16px; }
    .job { min-height:36px; gap:6px; padding:3px 0; }
    .L .name { font-size:12.5px; }
    .L .desc { display:none; }
    .btn { padding:5px 9px; font-size:12px; }
    .R .job { font-size:11.5px; gap:4px; white-space:normal; flex-wrap:wrap; overflow:visible; }   /* 칩이 많으면 줄바꿈 (왼쪽 칸 높이도 같이 늘어남) */
    .chip { margin-right:6px; padding:3px 0 1px; gap:4px; }
    .chip .t { font-size:9.5px; }
    .R .files a, .R .files span { max-width:110px; padding:1px 5px; font-size:10px; }
    .st { padding:1px 5px; font-size:10px; }
    header { padding:10px 12px; gap:8px; }
    header h1 { font-size:16px; }
    header .who { display:none; }
    header .runner { font-size:11px; padding:2px 8px; }
    .lastRefresh { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1 onclick="goHome()" title="홈으로">원격 실행 보드</h1>
  <span class="runner" id="runner"></span>
  <span class="who" id="who"></span>
  <button onclick="openSetup()">설정</button>
</header>

<div id="setup" style="display:none">
  <h2>연결 설정</h2>
  <label>Apps Script 웹앱 URL</label>
  <input id="cfgUrl" placeholder="https://script.google.com/macros/s/....../exec" value="https://script.google.com/macros/s/AKfycbxfPwqeMm7oy2bm4gUp3orBDBsTLrKA2Q9wQNC-ADs3Qp9hc2nZyT_uK7Lvmgqc4t3x/exec">
  <label>내 토큰 (구글 시트 [사용자] 탭)</label>
  <input id="cfgToken" placeholder="토큰">
  <button class="btn" onclick="saveSetup()">저장하고 연결</button>
  <p class="hint">설정은 이 브라우저에만 저장됩니다. 다른 PC·휴대폰에서는 다시 입력하세요.</p>
</div>

<main id="board" style="display:none"></main>
<div id="crop">
  <div class="tip">사진을 끌어서 위치를 맞추세요 (흰 틀 안쪽이 그대로 저장됩니다)</div>
  <div id="cropView"><img id="cropImg" alt=""><div class="guide"></div></div>
  <input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1">
  <div class="row"><button class="no" id="cropNo">취소</button><button class="ok" id="cropOk">저장</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const LS = 'remote_board_cfg', MINE = 'remote_board_mine';
let cfg = JSON.parse(localStorage.getItem(LS) || 'null');
let timer = null;
let mine = []; try { mine = JSON.parse(sessionStorage.getItem(MINE) || '[]'); } catch(_) {}   // 이 화면에서 누른 작업 ID

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
function openSetup(){ document.getElementById('setup').style.display='block'; document.getElementById('board').style.display='none';
  if(cfg){ cfgUrl.value=cfg.url; cfgToken.value=cfg.token; } }
function saveSetup(){ cfg={url:cfgUrl.value.trim(), token:cfgToken.value.trim()}; localStorage.setItem(LS, JSON.stringify(cfg)); init(); }
function goHome(){ init(); }   // 제목 클릭 → 설정 화면을 닫고 보드로 (버튼 목록도 다시 읽음)

async function api(params, body){
  const u = new URL(cfg.url); Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v)); u.searchParams.set('token', cfg.token);
  const opt = body ? { method:'POST', body: JSON.stringify(Object.assign({token:cfg.token}, body)), headers:{'Content-Type':'text/plain;charset=utf-8'} } : {};
  const r = await fetch(u, opt); return r.json();
}

async function init(){
  if(!cfg || !cfg.url || !cfg.token) return openSetup();
  try{
    const res = await api({action:'jobs'});
    if(!res.ok) { toast(res.error); return openSetup(); }
    document.getElementById('who').textContent = res.user + ' 님';
    showRunner(res.runner_seen, res.runner_busy);
    document.getElementById('setup').style.display='none'; document.getElementById('board').style.display='block';
    renderJobs(res.jobs); refreshStatus();
    clearInterval(timer); timer = setInterval(refreshStatus, 10000);
  }catch(e){ toast('연결 실패: '+e.message); openSetup(); }
}

function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// 구역 구성: 시트의 [주제] 를 큰 구역으로 묶는다. 목록에 없는 주제는 첫 구역으로 들어간다
const SECTIONS = [
  { title:'주문 / 재고', topics:null },          // null = 다른 구역에 속하지 않은 주제 전부
  { title:'상품',        topics:['상품'] },
];

function renderJobs(jobs){
  const b = document.getElementById('board'); b.innerHTML = '';
  const claimed = new Set(SECTIONS.flatMap(s => s.topics || []));
  SECTIONS.forEach(sec => {
    const mineJobs = jobs.filter(j => sec.topics ? sec.topics.includes(j['주제']) : !claimed.has(j['주제']));
    if(!mineJobs.length) return;
    const groups = {}; mineJobs.forEach(j => (groups[j['주제']] = groups[j['주제']] || []).push(j));
    const box = document.createElement('section'); box.className = 'sec'; b.appendChild(box);
    box.insertAdjacentHTML('beforeend', `<div class="L head"><h2>${esc(sec.title)}</h2></div><div class="R top"><h2>진행 상황 <span class="hint lastRefresh"></span></h2></div>`);
    const entries = Object.entries(groups);
    entries.forEach(([g, all], gi) => {
      // 파라미터 = '그룹' 인 작업은 줄을 따로 만들지 않고 소제목 오른쪽 끝에 버튼으로 붙인다 (예: 재고매칭 → 전체 자동실행)
      // 파라미터 '그룹사진' 은 소제목 버튼이되, 누르면 카메라가 바로 열려 찍은 사진을 드라이브에 저장 (재고체크 사진촬영)
      const headJob = (g !== sec.title) ? all.find(j => j['파라미터'] === '그룹' || j['파라미터'] === '그룹사진') : null;
      const list = all.filter(j => j !== headJob);
      const sp = gi ? ' sp' : '';   // 두 번째 소제목부터 위 여백
      // 주제 이름이 구역 제목과 같으면(예: 상품) 소제목은 생략
      if(g === sec.title) box.insertAdjacentHTML('beforeend', `<div class="L pad"></div><div class="R pad"></div>`);
      else {
        const Lh = document.createElement('div'); Lh.className = 'L gh' + sp;
        Lh.innerHTML = `<h3>${esc(g)}</h3>` + (headJob ? `<button class="btn" title="${esc(headJob['설명']||'')}">${esc(headJob['버튼이름'])}</button>` : '');
        const Rh = document.createElement('div'); Rh.className = 'R gh' + sp;
        Rh.innerHTML = headJob ? `<div class="job stat" data-code="${esc(headJob['작업코드'])}"></div>` : `<h3>.</h3>`;
        if(headJob) Lh.querySelector('button.btn').onclick = () => headJob['파라미터'] === '그룹사진' ? shootPhoto(headJob, Lh, Rh) : run(headJob, Lh);
        box.appendChild(Lh); box.appendChild(Rh);
      }
      list.forEach((j, i) => {
        const last = (gi === entries.length-1 && i === list.length-1) ? ' lastrow' : '';
        let paramHtml = '';
        const isRange = j['파라미터']==='기간', isPhoto = j['파라미터']==='사진';
        if(isRange){ paramHtml = `<span class="seg" data-k="range"><button type="button" data-v="today" class="on">오늘</button><button type="button" data-v="week">일주일</button></span>`; }
        else if(j['파라미터']==='텍스트'){ paramHtml = `<input type="text" data-k="text" placeholder="${esc(j['설명']||'')}">`; }
        const L = document.createElement('div'); L.className = 'L' + last;
        const desc = (!isRange && j['설명']) ? `<div class="desc">${esc(j['설명'])}</div>` : '';
        L.innerHTML = `<div class="job${paramHtml?' haspar':''}"><div class="name">${esc(j['버튼이름'])}${desc}</div><div class="ctl">${paramHtml}<button class="btn">적용</button></div></div>`;
        L.querySelectorAll('.seg button').forEach(b => b.onclick = () => { b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
        const R = document.createElement('div'); R.className = 'R' + last;
        R.innerHTML = `<div class="job stat" data-code="${esc(j['작업코드'])}"></div>`;
        L.querySelector('button.btn').onclick = () => isPhoto ? pickPhoto(j, L, R) : run(j, L);
        box.appendChild(L); box.appendChild(R);
      });
    });
    box.insertAdjacentHTML('beforeend', `<div class="L bot"></div><div class="R bot"></div>`);
  });
}

async function run(job, cell){
  const params = {}; cell.querySelectorAll('input').forEach(i => params[i.dataset.k] = i.value);
  let label = '';
  const seg = cell.querySelector('.seg button.on');
  if(seg){
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const end = new Date(), start = new Date();
    if(seg.dataset.v === 'week') start.setDate(start.getDate() - 6);     // 오늘 포함 최근 7일
    params.start = ymd(start); params.end = ymd(end); params.range = seg.dataset.v;
    label = seg.dataset.v === 'week' ? ` (일주일: ${params.start} ~ ${params.end})` : ` (오늘: ${params.end})`;
  }
  if(!confirm(`'${job['버튼이름']}'${label} 을(를) 실행할까요?`)) return;
  const btn = cell.querySelector('button'); btn.disabled = true;
  try{
    const res = await api({}, {action:'enqueue', code: job['작업코드'], params});
    if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); }
    toast(res.ok ? '요청 등록 — PC 러너가 곧 실행합니다' : ('실패: '+res.error));
    refreshStatus();
  }catch(e){ toast('요청 실패: '+e.message); }
  btn.disabled = false;
}

// ---------- 상품사진 등록 ----------
// 적용 → 휴대폰 사진첩(또는 카메라)에서 사진 선택 → 10:7 로 자르기 → 저장 이름 입력 → 업로드
// → 드라이브 image 폴더에 저장되고 PC 러너가 \\wondercompany\...\0-주문서 만들기 (클로드)\image 로 옮긴다
const PHOTO_MAX_EDGE = 2000, PHOTO_QUALITY = 0.9;
const photoErr = {};    // 작업코드 → 마지막 업로드 실패 메시지 (다음에 다시 올릴 때까지 화면에 남김)
const uploading = {};   // 작업코드 → true (업로드 중에는 상태칸을 갱신으로 덮지 않음)

function pickPhoto(job, cell, statCell){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; inp.remove();
    if(!file) return;
    const cropped = await cropPhoto(file);      // 10:7 로 자르기 (취소하면 null)
    if(!cropped) return;
    const base = file.name.replace(/\.[^.]+$/, '');
    let name = prompt('저장할 사진 이름을 입력하세요 (확장자 제외)', /^(image|img|dsc|pxl|photo|kakaotalk)/i.test(base) ? '' : base);
    if(name === null) return;
    name = name.replace(/[\\/:*?"<>|]/g, '').trim();
    if(!name){ toast('사진 이름을 입력해야 합니다'); return; }
    const btn = cell.querySelector('button.btn'); btn.disabled = true;
    const stat = statCell.querySelector('.stat'); uploading[job['작업코드']] = true; delete photoErr[job['작업코드']];
    try{
      stat.innerHTML = `<span class="st 실행중">업로드 중</span> <span class="files"><span>${esc(name)}</span></span>`;
      const { blob, mime } = cropped;
      const data = await toBase64(blob);
      const res = await api({}, { action:'upload', code: job['작업코드'], name, mime, data });
      if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); toast(`사진 업로드 완료 — PC 러너가 image 폴더에 저장합니다 (${res.name})`); }
      else { toast('실패: ' + res.error); photoErr[job['작업코드']] = res.error || '알 수 없는 오류'; }
    }catch(e){ toast('업로드 실패: ' + e.message); photoErr[job['작업코드']] = '전송 실패: ' + e.message; }
    delete uploading[job['작업코드']]; btn.disabled = false;
    refreshStatus();
  };
  inp.click();
}

// ---------- 재고체크 사진촬영 ----------
// [사진촬영] → 휴대폰 카메라가 바로 열림(사진첩 아님) → 찍으면 자르기·입력 없이 바로 업로드
// → Apps Script 가 드라이브 4_재고체크사진 폴더에 저장하고 [재고체크사진] 탭에 기록, 보드에는 즉시 '완료' 칩
// 수량 판독용이라 상품사진보다 크게(긴 변 2500px, JPEG 0.92). 한 장에 한 칸(한 상품), 칸 라벨이 같이 보이게 찍는다.
const STOCK_PHOTO_MAX_EDGE = 2500, STOCK_PHOTO_QUALITY = 0.92;
function shootPhoto(job, cell, statCell){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; inp.remove();
    if(!file) return;
    const btn = cell.querySelector('button.btn'); btn.disabled = true;
    const stat = statCell.querySelector('.stat'); uploading[job['작업코드']] = true; delete photoErr[job['작업코드']];
    try{
      const prev = stat.innerHTML;
      stat.innerHTML = `<span class="chip"><span class="st 실행중">업로드 중</span></span>` + prev;
      const { blob, mime } = await shrinkImage(file, STOCK_PHOTO_MAX_EDGE, STOCK_PHOTO_QUALITY);
      const data = await toBase64(blob);
      const res = await api({}, { action:'upload', code: job['작업코드'], mime, data });
      if(res.ok){ mine.push(res.id); sessionStorage.setItem(MINE, JSON.stringify(mine)); toast(`저장 완료 (${res.name}) — 계속 찍으려면 다시 누르세요`); }
      else { toast('실패: ' + res.error); photoErr[job['작업코드']] = res.error || '알 수 없는 오류'; }
    }catch(e){ toast('업로드 실패: ' + e.message); photoErr[job['작업코드']] = '전송 실패: ' + e.message; }
    delete uploading[job['작업코드']]; btn.disabled = false;
    refreshStatus();
  };
  inp.click();
}

// 사진 자르기: 가로 10 : 세로 7 틀을 띄워 위치·확대를 맞춘 뒤 그 부분만 잘라낸다 (긴 변 2000px 이하)
// 브라우저가 못 읽는 형식(HEIC 등)은 자르지 못하므로 원본 그대로 올린다
const CROP_W = 10, CROP_H = 7;
function cropPhoto(file){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const box = document.getElementById('crop'), view = document.getElementById('cropView');
    const img = document.getElementById('cropImg'), zoom = document.getElementById('cropZoom');
    const raw = () => resolve({ blob: file, mime: file.type || 'image/jpeg' });
    img.onerror = () => { URL.revokeObjectURL(url); toast('이 사진 형식은 자르기를 지원하지 않아 원본으로 올립니다'); raw(); };
    img.onload = () => {
      const iw = img.naturalWidth, ih = img.naturalHeight;
      box.classList.add('show');
      const vw = view.clientWidth, vh = view.clientHeight;
      const base = Math.max(vw / iw, vh / ih);      // 틀을 꽉 채우는 최소 배율
      let s = 1, x = 0, y = 0;                       // s = 확대, (x,y) = 사진 중심이 틀 중심에서 벗어난 거리(px)
      zoom.value = 1;
      const draw = () => {
        const dw = iw * base * s, dh = ih * base * s;
        x = Math.max(-(dw - vw) / 2, Math.min((dw - vw) / 2, x));
        y = Math.max(-(dh - vh) / 2, Math.min((dh - vh) / 2, y));
        img.style.width = dw + 'px'; img.style.height = dh + 'px';
        img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
      };
      draw();
      const pts = new Map(); let pinch = 0;
      const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
      view.onpointerdown = e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); if(pts.size === 2) pinch = dist(); };
      view.onpointermove = e => {
        const p = pts.get(e.pointerId); if(!p) return;
        if(pts.size === 1){ x += e.clientX - p.x; y += e.clientY - p.y; }
        p.x = e.clientX; p.y = e.clientY;
        if(pts.size === 2){ const d = dist(); if(pinch){ s = Math.max(1, Math.min(4, s * d / pinch)); zoom.value = s; } pinch = d; }
        draw();
      };
      view.onpointerup = view.onpointercancel = e => { pts.delete(e.pointerId); pinch = 0; };
      zoom.oninput = () => { s = Number(zoom.value); draw(); };
      const close = () => { box.classList.remove('show'); URL.revokeObjectURL(url); view.onpointerdown = view.onpointermove = view.onpointerup = view.onpointercancel = null; };
      document.getElementById('cropNo').onclick = () => { close(); resolve(null); };
      document.getElementById('cropOk').onclick = () => {
        const k = base * s, sw = vw / k, sh = vh / k;
        const sx = iw / 2 - x / k - sw / 2, sy = ih / 2 - y / k - sh / 2;
        const ow = Math.round(Math.min(sw, PHOTO_MAX_EDGE)), oh = Math.round(ow * CROP_H / CROP_W);
        try{
          const c = document.createElement('canvas'); c.width = ow; c.height = oh;
          c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, ow, oh);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          c.toBlob(b => { close(); b ? resolve({ blob: b, mime }) : raw(); }, mime, PHOTO_QUALITY);
        }catch(_){ close(); raw(); }
      };
    };
    img.src = url;
  });
}

// 사진을 긴 변 maxEdge 이하로 줄여 JPEG 로 (PNG 는 PNG 유지). 브라우저가 못 읽는 형식(HEIC 등)은 원본 그대로 올린다 (재고체크 사진촬영에서 사용)
function shrinkImage(file, maxEdge = PHOTO_MAX_EDGE, quality = PHOTO_QUALITY){
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const w = img.naturalWidth, h = img.naturalHeight, m = Math.max(w, h);
      const s = m > maxEdge ? maxEdge / m : 1;
      const cw = Math.round(w * s), ch = Math.round(h * s);
      try{
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img, 0, 0, cw, ch);
        const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        c.toBlob(b => resolve(b ? { blob: b, mime } : { blob: file, mime: file.type || 'image/jpeg' }), mime, quality);
      }catch(_){ resolve({ blob: file, mime: file.type || 'image/jpeg' }); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ blob: file, mime: file.type || 'image/jpeg' }); };
    img.src = url;
  });
}
function toBase64(blob){
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => no(new Error('파일 읽기 실패')); r.readAsDataURL(blob); });
}

// 러너 생존 표시: 60초 이내 접속이면 켜짐
function showRunner(seen, busy){
  const el = document.getElementById('runner'); if(!el) return;
  const ago = seen ? (Date.now() - Number(seen)) / 1000 : Infinity;
  if(busy){ el.className = 'runner on'; el.textContent = '● PC 러너 작업 실행 중'; }
  else if(ago < 60){ el.className = 'runner on'; el.textContent = '● PC 러너 켜짐'; }
  else { el.className = 'runner off'; el.textContent = seen ? `○ PC 러너 꺼짐 · 마지막 ${fmt(new Date(Number(seen)).toISOString())}` : '○ PC 러너 꺼짐'; }
}

// 시트 날짜는 UTC ISO 문자열로 오므로 한국 시간 HH:MM 으로 표시
function fmt(v){
  if(!v) return '';
  const d = new Date(v); if(isNaN(d)) return String(v).slice(11,16);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getHours())}:${p(d.getMinutes())}`;
}

// 파일 이름을 짧게: "(F_1) PC_LIST - 1007.xlsm" → "(F_1) 1007". 앞머리 괄호가 없으면 확장자만 뗀 이름 그대로
function shortName(n){
  const base = String(n).replace(/\.[^.]+$/, '').trim();
  const head = base.match(/^\s*(\([^)]*\))/);
  if(!head) return base;
  const date = base.match(/(\d{4,8})\s*$/);
  return date ? `${head[1]} ${date[1]}` : head[1];
}

// 칩 1개: 상태 배지 + 시각(대기·실행중은 누른 시각, 끝난 건은 완료 시각) + 파일 + 우측 상단 X
function chipHtml(q){
  const st = q['상태'];
  const running = (st==='실행중' || st==='중지요청'), waiting = (st==='대기');
  const when = (waiting || running) ? q['요청시각'] : (q['종료시각'] || q['요청시각']);
  const day = (() => { const d = new Date(when); if(isNaN(d)) return ''; const t = new Date(); return (d.toDateString() === t.toDateString()) ? '' : `${d.getMonth()+1}/${d.getDate()} `; })();
  const range = (() => { try { const o = JSON.parse(q['파라미터']||'{}'); return o.range === 'week' ? ' 일주일' : (o.range === 'today' ? ' 오늘' : ''); } catch(_) { return ''; } })();
  const names = String(q['결과파일']||'').split('\n').filter(Boolean);
  const links = String(q['결과링크']||'').split('\n').filter(Boolean);
  const files = names.map((n,i) => links[i]
    ? `<a href="${esc(links[i])}" target="_blank" title="${esc(n)}">${esc(shortName(n))}</a>`
    : `<span title="${esc(n)} (드라이브 동기화 중)">${esc(shortName(n))}</span>`).join('');
  const xTitle = waiting ? '대기 취소' : (running ? '실행 중지' : '표시 지우기');
  return `<span class="chip ${esc(st)}"><span class="b"><span class="st ${esc(st)}">${esc(st)}</span><button class="x" data-id="${esc(q['ID'])}" data-st="${esc(st)}" title="${xTitle}">×</button><span class="t">${day}${fmt(when)}${range}</span></span>${files?`<span class="files">${files}</span>`:''}</span>`;
}

// X 버튼: 대기 → 취소 / 실행중 → PC 러너에 중지 요청 / 끝난 건 → 표시 삭제
async function cancelJob(id, st, code){
  if(st==='실행중' || st==='중지요청'){ if(!confirm('실행 중인 작업을 중지할까요?\n(PC 에서 돌고 있는 프로그램을 강제로 끝냅니다)')) return; }
  try{
    const res = await api({}, {action:'cancel', id});
    if(!res.ok){ toast('실패: '+res.error); return; }
    toast(res.result==='중지요청' ? '중지 요청 — PC 러너가 곧 끊습니다' : (res.result==='취소' ? '대기 취소됨' : '표시 지움'));
    refreshStatus();
  }catch(e){ toast('요청 실패: '+e.message); }
}

// 작업코드별 오늘 건을 같은 줄 오른쪽에 칩으로 (시트는 작업별 마지막 결과 1건 + 대기·실행중만 남긴다)
async function refreshStatus(){
  try{
    const res = await api({action:'queue', n:50});
    if(!res.ok) return;
    showRunner(res.runner_seen, res.runner_busy);
    // 작업코드별로 오늘 건을 시간순(먼저 누른 것이 앞)으로 모두 칩으로 표시: [완료 12:28 파일] [실행중 13:57 ×] [대기 14:04 ×] [대기 14:09 ×]
    const byCode = {};
    res.queue.slice().reverse().forEach(q => { if(q['상태']==='취소') return; (byCode[q['작업코드']] = byCode[q['작업코드']] || []).push(q); });
    document.querySelectorAll('.stat').forEach(el => {
      if(uploading[el.dataset.code]) return;
      const list = byCode[el.dataset.code] || [];
      const err = photoErr[el.dataset.code];
      el.innerHTML = list.map(chipHtml).join('') + (err ? `<span class="chip"><span class="st 실패">업로드 실패</span><span class="uperr">${esc(err)}</span></span>` : '');
      el.querySelectorAll('.x').forEach(x => x.onclick = () => cancelJob(x.dataset.id, x.dataset.st, el.dataset.code));
    });
    document.querySelectorAll('.lastRefresh').forEach(lr => lr.textContent = '· ' + new Date().toLocaleTimeString('ko-KR') + ' 갱신');
  }catch(_){}
}
init();
</script>
